name: Download On Dispatch
 
on:
  repository_dispatch:
    types: [sync_event]
 
jobs:
  download:
    runs-on: [self-hosted, linux]
 
    steps:
 
      - name: Get artifact id
        id: get_id
        run: |
          echo "ART_ID=${{ github.event.client_payload.artifact_id }}" >> $GITHUB_OUTPUT
 
      - name: Check duplicate
        id: check
        run: |
          STATE="/home/szsw/docker_image_sync/github/last_id.txt"
          NEW="${{ steps.get_id.outputs.ART_ID }}"
 
          mkdir -p /home/szsw/docker_image_sync/github/image_from_remote
 
          if [ -f "$STATE" ]; then
            LAST=$(cat $STATE)
          else
            LAST="0"
          fi
 
          if [ "$NEW" = "$LAST" ]; then
            echo "DUP=true" >> $GITHUB_OUTPUT
          else
            echo "DUP=false" >> $GITHUB_OUTPUT
          fi
 
      - name: Download artifact
        if: steps.check.outputs.DUP == 'false'
        run: |
          ART_ID="${{ steps.get_id.outputs.ART_ID }}"
          API="https://api.github.com/repos/liudongdongdong7397/aliyun_docker_sync/actions/artifacts/$ART_ID/zip"
 
          mkdir -p /home/szsw/docker_image_sync/github/image_from_remote
          rm -rf /home/szsw/docker_image_sync/github/image_from_remote/artifact.zip
          curl -L \
            -H "Authorization: Bearer ${{ secrets.LIUDONGDONG7397 }}" \
            -H "Accept: application/vnd.github+json" \
            -o /home/szsw/docker_image_sync/github/image_from_remote/artifact.zip \
            "$API"
 
      - name: Extract
        if: steps.check.outputs.DUP == 'false'
        run: |
          cd /home/szsw/docker_image_sync/github/image_from_remote
          unzip -o artifact.zip
          mv *.tar /home/szsw/docker_image_sync/monitor_directory
 
      - name: Update state
        if: steps.check.outputs.DUP == 'false'
        run: |
          echo "${{ steps.get_id.outputs.ART_ID }}" > /home/szsw/docker_image_sync/github/last_id.txt
